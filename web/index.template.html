<title>น้องมะระ เจรจาแทนกลุ่ม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: แถบหัว + แท็บสถานการณ์ → สองคอลัมน์ (ไทม์ไลน์การเจรจา | สรุปผล อนุมัติ เปรียบเทียบผู้ซื้อ) → มือถือเรียงเป็นคอลัมน์เดียว */
:root {
  --bg: #f2f5ef; --surface: #ffffff; --sunk: #e9eee5; --ink: #17221a; --muted: #586659; --line: #d7dfd2;
  --accent: #1d6a43; --accent-ink: #ffffff; --accent-soft: #dfeee4;
  --buyer: #3a4c9c; --buyer-soft: #e5e8f6;
  --warn: #8f5400; --warn-soft: #faedd4;
  --danger: #b0261b; --danger-soft: #fae2de;
  --display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #161e18; --sunk: #1c261f; --ink: #e5ede6; --muted: #98a79b; --line: #29352c;
    --accent: #5fc58c; --accent-ink: #0b1a10; --accent-soft: #1b3324;
    --buyer: #a5b5f5; --buyer-soft: #1f2542;
    --warn: #f1b75c; --warn-soft: #382a12;
    --danger: #ff8b7b; --danger-soft: #3c1a16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #161e18; --sunk: #1c261f; --ink: #e5ede6; --muted: #98a79b; --line: #29352c;
  --accent: #5fc58c; --accent-ink: #0b1a10; --accent-soft: #1b3324;
  --buyer: #a5b5f5; --buyer-soft: #1f2542;
  --warn: #f1b75c; --warn-soft: #382a12;
  --danger: #ff8b7b; --danger-soft: #3c1a16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); margin: 0; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.25; margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .04em; color: var(--muted); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* หัว */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 700; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--muted); max-width: 60ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; background: var(--sunk); border-radius: 999px; }
.tabs button { border: 0; background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .12); color: var(--accent); }
.note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 16px 0 20px; }
.note p { margin: 0; flex: 1 1 380px; min-width: 0; }
.play { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 8px; font-weight: 600; }
.play.secondary { background: transparent; color: var(--accent); }

/* กริดหลัก */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 920px) { .grid { grid-template-columns: minmax(0, 1fr); } .side { position: static; order: -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel h2 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }

/* ไทม์ไลน์ */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; }
.step .when { padding-top: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.agent { background: var(--accent-soft); color: var(--accent); }
.chip.buyer { background: var(--buyer-soft); color: var(--buyer); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.card.buyer { border-left: 3px solid var(--buyer); }
.card.agent { border-left: 3px solid var(--accent); }
.card.danger { background: var(--danger-soft); border-color: transparent; }
.card.warn { background: var(--warn-soft); border-color: transparent; }
.card.quiet { background: transparent; border-style: dashed; padding: 8px 12px; }
.card p { margin: 0; }
.card .pre { white-space: pre-line; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.big { font-family: var(--mono); font-size: 22px; font-weight: 500; }
.evid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.evid span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; background: var(--sunk); }
.evid span.sim { border-style: dashed; color: var(--muted); }
.evid span b { font-family: var(--mono); font-weight: 500; color: var(--muted); margin-right: 4px; }
.why { font-size: 13px; color: var(--muted); margin-top: 6px; }
.objection { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 6px 6px 0; font-size: 13px; }
.ack { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.chart .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.msg { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 14px; }
.who { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; border: 1px solid currentColor; }
.pill.ok { color: var(--accent); } .pill.bad { color: var(--danger); } .pill.mid { color: var(--warn); } .pill.info { color: var(--buyer); }
.hits { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hits li { padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 14px; }
.hits .src { font-size: 12px; font-weight: 600; color: var(--accent); }
.hits .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hits li.open .txt { -webkit-line-clamp: unset; }
.hits button { border: 0; background: none; color: var(--muted); padding: 0; font-size: 12px; text-decoration: underline; }
.quotes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quotes span { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--sunk); }
.step.hidden-step { display: none; }
/* มุมมองแชต: น้องมะระ (ขวา) ↔ ผู้ซื้อ (ซ้าย) · ขั้นตอนของระบบเป็นบรรทัดเล็กตรงกลาง */
.timeline { gap: 8px; }
.step.cmsg, .step.cnote { display: flex; gap: 8px; }
.step.cmsg { align-items: flex-end; }
.step.cmsg.me { flex-direction: row-reverse; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--buyer-soft); color: var(--buyer); }
.step.cmsg.me .avatar { background: var(--accent-soft); color: var(--accent); }
.bubble { max-width: min(560px, 84%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; padding: 9px 13px; }
.step.cmsg.me .bubble { background: var(--accent-soft); border-color: transparent; border-radius: 18px 18px 6px 18px; }
.bubble .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bubble .who b { color: var(--ink); font-weight: 600; }
.bubble .text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .meta { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.bubble .tag { font-family: var(--mono); font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.step.cmsg.me .bubble .tag { border-color: transparent; }
.bubble details { margin-top: 6px; font-size: 13px; color: var(--muted); }
.bubble summary { cursor: pointer; font-size: 12px; }
.bubble details ul { margin: 6px 0 0; padding-left: 18px; }
.step.cnote { justify-content: center; }
.step.cnote .cn { font-size: 12.5px; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 4px 12px; max-width: 92%; text-align: center; line-height: 1.5; }
.step.cnote.bad .cn { background: var(--danger-soft); color: var(--danger); border-radius: 12px; }
.step.cnote.ok .cn { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 12px; }
.step.cnote.warn .cn { background: var(--warn-soft); color: var(--warn); font-weight: 600; border-radius: 12px; }
.step.cnote details { display: inline; } .step.cnote summary { display: inline; cursor: pointer; text-decoration: underline dotted; }
.step.cnote .chits { text-align: left; margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .step.reveal { animation: rise .35s ease-out; } @keyframes rise { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
@media (max-width: 560px) { .step { grid-template-columns: minmax(0, 1fr); gap: 4px; } .step .when { flex-direction: row; padding-top: 0; } }

/* ด้านข้าง */
.outcome h2 { font-size: 20px; }
.outcome.ok { border-color: var(--accent); }
.outcome.warn { border-color: var(--warn); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; text-align: right; }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { background: var(--sunk); border-radius: 8px; padding: 10px; }
.metric.wide { grid-column: 1 / -1; }
.metric b { display: block; font-family: var(--mono); font-size: 20px; font-weight: 500; }
.metric.hl { background: var(--accent-soft); }
.metric.hl b { color: var(--accent); }
.metric.bad b { color: var(--danger); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.chosen td { background: var(--accent-soft); }
tr.out td { color: var(--muted); text-decoration: line-through; }
.farmers { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.farmers li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.farmers .fname, .farmers .fnet { display: flex; flex-direction: column; min-width: 0; }
.farmers .fnet { text-align: right; }
.farmers .seg { grid-column: 1 / -1; justify-self: start; }
.farmers li.out .fname b, .farmers li.out .fnet b { text-decoration: line-through; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 14px; font-size: 13px; }
.seg button[aria-pressed="true"].yes { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"].no { background: var(--danger); color: #fff; }
.statusline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.statusline span { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--sunk); }
.statusline span b { font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 14px; }
.live { margin-bottom: 20px; border-color: var(--accent); }
.live select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>น้อง<span>มะระ</span> · MaRa-AgriAlly</h1>
      <p>AI Agent ที่รวมผลผลิตเกษตรกรรายย่อยเป็นกลุ่ม แล้วเจรจาขายแทน โดยเกษตรกรเป็นผู้อนุมัติดีลเองทุกครั้ง</p>
    </div>
    <nav class="tabs" role="tablist" id="tabs" aria-label="เลือกสถานการณ์"></nav>
  </header>

  <div class="note">
    <p id="scenarioNote"></p>
    <button class="play" id="playBtn" type="button">เล่นการเจรจาทีละขั้น</button>
    <button class="play secondary" id="allBtn" type="button" hidden>แสดงทั้งหมด</button>
  </div>

  <section class="panel live" id="liveBar" hidden>
    <div class="row" style="gap:10px 16px">
      <b>เจรจาสดบน AWS</b>
      <label class="small" for="liveCrop">พืช</label>
      <select id="liveCrop"><option value="rice_hommali">ข้าวหอมมะลิ · ร้อยเอ็ด</option><option value="cassava">มันสำปะหลัง · นครราชสีมา</option><option value="bitter_gourd">มะระจีน · ราชบุรี</option></select>
      <button class="play" id="liveStart" type="button">เริ่มเจรจาด้วย AI</button>
      <span class="small muted" id="liveMsg"></span>
    </div>
  </section>

  <div class="grid">
    <main>
      <ol class="timeline" id="timeline" aria-live="polite"></ol>
    </main>
    <aside class="side" id="side"></aside>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script id="demo-data" type="application/json">__DEMO_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('demo-data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const baht = (n, d = 2) => Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
  const kg = (n) => Number(n).toLocaleString('th-TH');
  const time = (iso) => new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Bangkok' });
  const DECISION = { offer: ['เสนอราคา', 'info'], counter: ['โต้กลับ', 'info'], final_offer: ['ข้อเสนอสุดท้าย', 'mid'], accept: ['ตกลง', 'ok'], walk_away: ['ถอนตัว', 'bad'] };
  const BLOCK = { below_floor: 'ต่ำกว่าราคาขั้นต่ำของสมาชิก', private_data_leak: 'ตัวเลขตรงกับราคาขั้นต่ำของสมาชิก', below_buyer_offer: 'เสนอต่ำกว่าที่ผู้ซื้อให้อยู่แล้ว', round_limit: 'เกินจำนวนรอบที่กำหนด', invalid_input: 'ข้อมูลไม่ถูกต้อง', unverified_number: 'ตัวเลขที่ไม่มีหลักฐาน' };
  const STRATEGY = { anchor: 'ตั้งราคาเปิดพร้อมเหตุผล', evidence_value: 'ชี้คุณค่าด้วยหลักฐาน', address_objection: 'ตอบข้อกังวลของผู้ซื้อ', conditional_concession: 'ยอมลดแบบมีเงื่อนไข', trade_off: 'แลกเงื่อนไข', contest_deduction: 'ต่อรองส่วนหัก', competitive_leverage: 'อ้างข้อเสนอจริงของรายอื่น', final_push: 'ขอปิดดีล' };
  const TAG = { market_reference: 'ราคาตลาด', volume: 'ปริมาณรวม', quality_grade: 'คุณภาพ/เกรด', delivery_ready: 'การส่งมอบ', consolidated_logistics: 'รวมขนส่ง', competing_offer: 'ข้อเสนอรายอื่น', buyer_history: 'ประวัติราคา' };

  let current = null;
  let timer = null;
  const approvals = {}; // scenarioId -> { farmerId: 'yes' | 'no' }

  function buyerNames(sc) {
    const m = {};
    for (const s of sc.steps) if (s.kind === 'buyer') m[s.buyerId] = s.buyer;
    return m;
  }

  function stepHTML(s, sc, names) {
    const at = `<span class="time">${time(s.at)}</span>`;
    const note = (body, cls = '') => `<li class="step cnote ${cls}"><div class="cn">${body}</div></li>`;
    const initial = (name) => esc(String(name ?? '?').replace(/^(โรงสี|ผู้ส่งออก|ตลาดค้าส่ง)(จำลอง)?\s*/, '').slice(0, 2) || '?');
    const ded = (list) => (list ?? []).map((d) => typeof d === 'string' ? d : d.kind === 'percent' ? `${d.label} ${d.percent}%` : d.kind === 'per_kg' ? `${d.label} ${d.amountPerKg} บาท/กก.` : `${d.label} ${d.amount} บาท`);
    switch (s.kind) {
      case 'market':
        return s.available
          ? note(`น้องมะระดูราคาตลาด NABC (${esc(s.date)}${s.stale ? ' · ข้อมูลล่าสุดที่มี' : ''}): ราคากลาง <b class="num">${baht(s.medianPerKg)}</b> บาท/กก. ช่วง ${baht(s.minPerKg)}–${baht(s.maxPerKg)}`)
          : note(esc(s.note));
      case 'rag':
        return note(`<details><summary>ค้นข้อมูลอ้างอิง: ${esc(s.query)}</summary><ul class="chits">${s.hits.map((h) => `<li><b>${esc(h.source)}</b> — ${esc(h.text).slice(0, 220)}…</li>`).join('')}</ul></details>`);
      case 'buyers':
        return note(`หาผู้ซื้อที่รับปริมาณนี้ได้ ${s.buyers.length} ราย: ${s.buyers.map((b) => esc(b.name)).join(', ') || '–'}`);
      case 'history':
        return note(`ประวัติที่เคยคุยกับ ${esc(names[s.buyerId] ?? s.buyerId)}: ${s.records.slice(0, 2).map((r) => `เปิด ${baht(r.openingPerKg)} → จบ ${baht(r.finalPerKg)}`).join(' · ')}`);
      case 'buyer': {
        const [lbl] = DECISION[s.decision] ?? [s.decision];
        const d = ded(s.deductions);
        const msg = s.objection && !String(s.message).includes(s.objection.text) ? `${s.message} ${s.objection.text}` : s.message;
        return `<li class="step cmsg"><div class="avatar" aria-hidden="true">${initial(s.buyer)}</div><div class="bubble">
          <div class="who"><b>${esc(s.buyer)}</b>${at}</div>
          <div class="text">${esc(msg)}</div>
          <div class="meta"><span class="tag">${baht(s.price)} บาท/กก.</span><span>${esc(lbl)}</span>${d.length ? `<span>· ${esc(d.join(', '))}</span>` : ''}${s.acknowledged?.length ? `<span>· เห็นด้วยเรื่อง${esc(s.acknowledged.map((t) => TAG[t] ?? t).join(', '))}</span>` : ''}</div>
        </div></li>`;
      }
      case 'counter':
        return `<li class="step cmsg me"><div class="avatar" aria-hidden="true">มะ</div><div class="bubble">
          <div class="who"><b>น้องมะระ</b> ถึง ${esc(names[s.buyerId] ?? s.buyerId)} ${at}</div>
          <div class="text">${esc(s.message)}</div>
          <div class="meta"><span class="tag">ขอ ${baht(s.price)} บาท/กก.</span>${s.contest?.length ? `<span>· ขอลด${esc(s.contest.join(', '))}</span>` : ''}</div>
          ${s.strategy ? `<details><summary>ทำไมพูดแบบนี้</summary><p style="margin-top:4px">${esc(STRATEGY[s.strategy] ?? s.strategy)}${s.rationale ? ` — ${esc(s.rationale)}` : ''}</p>${s.evidence?.length ? `<ul>${s.evidence.map((e) => `<li>${e.verified ? '' : '(ข้อมูลจำลอง) '}${esc(e.label)}</li>`).join('')}</ul>` : ''}</details>` : ''}
        </div></li>`;
      case 'evaluation':
        return note(`คิดราคาสุทธิให้แล้ว: ${esc(s.buyer ?? s.buyerId)} ${baht(s.price)} → เกษตรกรได้เฉลี่ย <b class="num">${baht(s.netAvg)}</b> บาท/กก. · ${s.passes ? 'ผ่านขั้นต่ำทุกคน' : `ยังต่ำกว่าขั้นต่ำ ${s.below} คน`}`);
      case 'blocked':
        return note(`<details><summary>ระบบป้องกันไม่ส่งข้อความนี้ถึงผู้ซื้อ: ${esc(BLOCK[s.code] ?? s.code)}</summary> — ${esc(s.reason)}</details>`, 'bad');
      case 'tool_error':
        return note(esc(s.error));
      case 'llm_error':
        return note(`AI ขัดข้อง: ${esc(s.error)}`, 'bad');
      case 'outcome':
        return s.outcomeKind === 'prepared'
          ? note(`น้องมะระเลือก ${esc(s.buyerName)} แล้วส่งให้เกษตรกรตัดสินใจ — ยังไม่ปิดดีลจนกว่าทุกคนกดอนุมัติ`, 'ok')
          : note(`${s.outcomeKind === 'escalated' ? 'ส่งเรื่องให้กลุ่มตัดสินใจ' : 'หยุดอย่างปลอดภัย'}: ${esc(s.reason)}`, 'warn');
      default:
        return '';
    }
  }

  function comparison(sc) {
    const rows = {};
    for (const s of sc.steps) {
      if (s.kind === 'buyer') {
        rows[s.buyerId] ??= { name: s.buyer, open: s.price, decision: s.decision };
        rows[s.buyerId].decision = s.decision;
        rows[s.buyerId].last = s.price;
      }
      if (s.kind === 'evaluation' && rows[s.buyerId]) {
        rows[s.buyerId].openNet ??= s.netAvg;
        rows[s.buyerId].net = s.netAvg;
        rows[s.buyerId].passes = s.passes;
      }
    }
    const ids = Object.keys(rows);
    if (!ids.length) return '';
    return `<section class="panel"><h2>เทียบผู้ซื้อด้วยราคาสุทธิ</h2><div class="scroll"><table>
      <thead><tr><th>ผู้ซื้อ</th><th class="n">ราคาเปิด</th><th class="n">สุทธิเปิด</th><th class="n">สุทธิล่าสุด</th></tr></thead>
      <tbody>${ids.map((id) => { const r = rows[id]; return `<tr class="${sc.deal?.buyerId === id ? 'chosen' : ''}">
        <td>${esc(r.name)}<div class="small muted">${(DECISION[r.decision] ?? [r.decision])[0]}${r.passes === false ? ' · ไม่ผ่านขั้นต่ำ' : ''}</div></td>
        <td class="n">${baht(r.open)}</td><td class="n">${r.openNet != null ? baht(r.openNet) : '–'}</td><td class="n"><b>${r.net != null ? baht(r.net) : '–'}</b></td></tr>`; }).join('')}</tbody>
    </table></div><p class="small muted" style="margin-top:8px">ราคาสุทธิ = ราคาหลังหักค่าขนส่งและส่วนหักทั้งหมด เฉลี่ยทั้งกลุ่ม (บาท/กก.)</p></section>`;
  }

  /** กราฟราคาแต่ละรอบ: ผู้ซื้อเสนอ (เส้นทึบ) กับน้องมะระขอ (เส้นประ) — ไม่แสดงราคาขั้นต่ำ */
  function priceChart(sc, names) {
    const COLORS = ['#3a4c9c', '#1d6a43', '#8f5400', '#b0261b'];
    const series = {};
    for (const s of sc.steps) {
      if (s.kind === 'buyer') (series[s.buyerId] ??= { offers: [], asks: [] }).offers.push(s.price);
      if (s.kind === 'counter') (series[s.buyerId] ??= { offers: [], asks: [] }).asks.push(s.price);
    }
    const ids = Object.keys(series).filter((id) => series[id].asks.length);
    if (!ids.length) return '';
    const all = ids.flatMap((id) => [...series[id].offers, ...series[id].asks]);
    const lo = Math.min(...all), hi = Math.max(...all), span = Math.max(hi - lo, 0.01);
    const n = Math.max(...ids.map((id) => Math.max(series[id].offers.length, series[id].asks.length + 1)));
    const W = 320, H = 170, P = 30;
    const x = (i) => P + (i * (W - P - 10)) / Math.max(n - 1, 1);
    const y = (v) => H - 20 - ((v - lo) / span) * (H - 40);
    const line = (pts, color, dash) => `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''} points="${pts.map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>` + pts.map(([i, v]) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
    const body = ids.map((id, k) => {
      const c = COLORS[k % COLORS.length];
      return line(series[id].offers.map((v, i) => [i, v]), c, false) + line(series[id].asks.map((v, i) => [i + 1, v]), c, true);
    }).join('');
    const axis = `<text x="4" y="${y(hi) + 4}" font-size="10" fill="currentColor">${baht(hi)}</text><text x="4" y="${y(lo) + 4}" font-size="10" fill="currentColor">${baht(lo)}</text><line x1="${P}" x2="${W - 10}" y1="${H - 20}" y2="${H - 20}" stroke="currentColor" stroke-opacity=".2"/>`;
    return `<section class="panel chart"><h2>ราคาแต่ละรอบ</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟราคาที่ผู้ซื้อเสนอและที่น้องมะระขอในแต่ละรอบ" style="color:var(--muted)">${axis}${body}</svg>
      <div class="legend">${ids.map((id, k) => `<span><i style="background:${COLORS[k % COLORS.length]}"></i>${esc(names[id] ?? id)}</span>`).join('')}<span>เส้นทึบ = ผู้ซื้อเสนอ · เส้นประ = น้องมะระขอ</span></div></section>`;
  }

  function metricsHTML(sc) {
    const m = sc.metrics;
    if (!m) return '';
    const rounds = Object.values(m.roundsByBuyer).reduce((a, b) => a + b, 0);
    const uplift = m.upliftVsBestOpeningPerKg;
    return `<section class="panel"><h2>ตัวชี้วัด</h2><div class="metrics">
      ${m.upliftVsChosenOpeningPerKg != null ? `<div class="metric hl"><span class="label">สุทธิเพิ่มจากข้อเสนอแรกของผู้ซื้อรายนี้</span><b>+${baht(m.upliftVsChosenOpeningPerKg)}</b><span class="small">บาท/กก. · ≈${baht(m.upliftVsChosenOpeningBaht, 0)} บาท ทั้งกลุ่ม</span></div>` : ''}
      ${uplift != null ? `<div class="metric"><span class="label">เทียบข้อเสนอแรกที่ดีที่สุด</span><b>+${baht(uplift)}</b><span class="small">บาท/กก.</span></div>` : ''}
      ${m.strategies && Object.keys(m.strategies).length ? `<div class="metric wide"><span class="label">กลยุทธ์ที่ใช้</span><span class="small">${Object.entries(m.strategies).map(([k, v]) => `${esc(STRATEGY[k] ?? k)} ×${v}`).join(' · ')}${m.repeatedMoves ? ` · ใช้เหตุผลซ้ำ ${m.repeatedMoves} ครั้ง` : ''}</span></div>` : ''}
      <div class="metric"><span class="label">ผู้ซื้อที่เจรจา</span><b>${m.buyersContacted}</b><span class="small">ราย · ${rounds} รอบ</span></div>
      <div class="metric ${m.guardrailBlocks ? 'bad' : ''}"><span class="label">ระบบป้องกันบล็อก</span><b>${m.guardrailBlocks}</b><span class="small">ครั้ง</span></div>
      <div class="metric"><span class="label">ขั้นการทำงานของ AI</span><b>${m.steps}</b><span class="small">ขั้น · ${m.toolCalls} tool calls</span></div>
      ${m.marketMedianPerKg != null ? `<div class="metric wide"><span class="label">ราคากลางตลาด (NABC)</span><b>${baht(m.marketMedianPerKg)}</b><span class="small">บาท/กก. ราคาหน้า</span></div>` : ''}
    </div><p class="small muted" style="margin-top:8px">${esc(m.label)}</p></section>`;
  }

  function approvalHTML(sc) {
    const g = sc.group;
    if (sc.status === 'queued' || sc.status === 'negotiating') {
      return `<section class="panel outcome"><span class="chip agent">กำลังเจรจา</span><h2 style="margin-top:8px">น้องมะระกำลังทำงาน…</h2>
        <p class="small muted" style="margin-top:6px">ขั้นที่ทำแล้ว ${sc.steps.length} ขั้น · หน้านี้อัปเดตเอง</p></section>`;
    }
    if (!sc.deal) {
      return `<section class="panel outcome warn"><span class="chip warn">${sc.outcome === 'escalated' ? 'ส่งเรื่องให้กลุ่ม' : 'หยุดอย่างปลอดภัย'}</span>
        <h2 style="margin-top:8px">ยังไม่มีดีลให้อนุมัติ</h2><p class="small" style="margin-top:6px">${esc(sc.reason)}</p>
        <dl class="kv"><dt>กลุ่ม</dt><dd>${esc(g.cropLabel)} เกรด ${g.grade}</dd><dt>ปริมาณรวม</dt><dd class="num">${kg(g.totalKg)} กก.</dd><dt>สมาชิก</dt><dd>${g.members} ราย</dd></dl>
        <p class="small muted" style="margin-top:10px">ทางเลือกของกลุ่ม: รอรอบราคาใหม่ หาผู้ซื้อเพิ่ม หรือสมาชิกแต่ละคนปรับราคาขั้นต่ำของตัวเอง (คนอื่นแก้แทนไม่ได้)</p></section>`;
    }
    const a = sc.live ? Object.fromEntries(Object.entries(sc.approvals ?? {}).map(([k, v]) => [k, v === 'approve' ? 'yes' : 'no'])) : (approvals[sc.id] ??= {});
    const buyerMin = sc.buyerMinKg ?? (sc.steps.find((s) => s.kind === 'buyers')?.buyers ?? []).find((b) => b.id === sc.deal.buyerId)?.minKg ?? 0;
    const active = sc.farmers.filter((f) => a[f.id] !== 'no');
    const activeKg = active.reduce((t, f) => t + f.kg, 0);
    const allYes = active.length > 0 && active.every((f) => a[f.id] === 'yes');
    const enough = activeKg >= buyerMin;
    const agreed = sc.live ? sc.status === 'agreed' : allYes && enough;
    const deal = agreed ? 'ตกลงแล้ว' : !enough ? 'ต้องเจรจาใหม่ (ปริมาณไม่พอ)' : sc.live && sc.attention ? 'รออนุมัติ · ' + sc.attention : 'รออนุมัติ';
    return `<section class="panel outcome ok"><span class="chip agent">รอเกษตรกรอนุมัติ</span>
      <h2 style="margin-top:8px">${esc(sc.deal.buyer)} · <span class="num">${baht(sc.deal.price)}</span> บาท/กก.</h2>
      <p class="small muted">${sc.deal.deductions.length ? esc(sc.deal.deductions.join(', ')) + ' · ' : ''}สุทธิเฉลี่ย <b class="num">${baht(sc.deal.netAvg)}</b> บาท/กก.</p>
      <ul class="farmers">${sc.farmers.map((f) => `<li class="${a[f.id] === 'no' ? 'out' : ''}">
          <div class="fname"><b>${esc(f.name)}</b><span class="small muted">${esc(f.district)} · <span class="num">${kg(f.kg)}</span> กก. · ${f.passesFloor ? 'ผ่านขั้นต่ำ ✓' : 'ต่ำกว่าขั้นต่ำ'}</span></div>
          <div class="fnet"><b class="num">${baht(f.netPerKg)}</b><span class="small muted">บาท/กก. · รับ <span class="num">${baht(f.netTotal, 0)}</span> บาท</span></div>
          <span class="seg" role="group" aria-label="อนุมัติของ ${esc(f.name)}"><button type="button" class="yes" data-f="${f.id}" data-v="yes" aria-pressed="${a[f.id] === 'yes'}">ตกลง</button><button type="button" class="no" data-f="${f.id}" data-v="no" aria-pressed="${a[f.id] === 'no'}">ไม่</button></span>
        </li>`).join('')}</ul>
      <p class="small muted" style="margin-top:8px">ผู้ซื้อโอนเงินตรงเข้าบัญชีของเกษตรกรแต่ละคน ระบบไม่ถือเงิน · ราคาขั้นต่ำของแต่ละคนไม่แสดงและไม่ส่งให้ผู้ซื้อ</p>
      <div class="statusline">
        <span>ดีล: <b>${deal}</b></span>
        <span>ส่งมอบ: <b>${agreed ? 'รอนัดวัน' : 'ยังไม่เริ่ม'}</b></span>
        <span>ชำระเงิน: <b>ยังไม่ถึงกำหนด</b></span>
        <span>ปริมาณ: <b class="num">${kg(activeKg)}</b> / ขั้นต่ำผู้ซื้อ ${kg(buyerMin)} กก.</span>
      </div>
      ${sc.live ? `<p class="small muted" style="margin-top:8px">${sc.ledgerVerified ? 'ตรวจ hash chain ของ ledger แล้ว: ไม่มีการแก้ไขย้อนหลัง ✓' : 'ledger ตรวจไม่ผ่าน'}</p>` : `<div class="actions"><button type="button" id="allYes">ทุกคนกดตกลง</button><button type="button" id="resetAppr">เริ่มใหม่</button></div>`}
      <p class="small muted" style="margin-top:8px">ลองกด "ไม่" ให้สมาชิกบางคน: คนนั้นถอนตัว กลุ่มไปต่อได้ถ้าปริมาณยังพอ</p>
    </section>`;
  }

  function renderSide(sc) {
    const g = sc.group;
    $('#side').innerHTML = approvalHTML(sc) + metricsHTML(sc) + priceChart(sc, buyerNames(sc)) + comparison(sc) + `
      <section class="panel"><h2>กลุ่มเกษตรกร</h2><dl class="kv">
        <dt>พืช</dt><dd>${esc(g.cropLabel)} เกรด ${g.grade}</dd>
        <dt>จังหวัด</dt><dd>${esc(g.province)}</dd>
        <dt>สมาชิก</dt><dd>${g.members} ราย</dd>
        <dt>ปริมาณรวม</dt><dd class="num">${kg(g.totalKg)} กก.</dd>
        <dt>ส่งมอบ</dt><dd>${esc(g.window.from)} ถึง ${esc(g.window.to)}</dd>
        <dt>AI ที่ใช้</dt><dd class="small">${sc.llm.startsWith('bedrock') ? 'Amazon Nova บน Bedrock' : sc.llm.startsWith('mock') ? 'กฎตายตัว (สำรอง) · เวอร์ชันใช้งานจริงใช้ Amazon Nova' : sc.llm.startsWith('scripted') ? 'สคริปต์ทดสอบ (จำลองว่า AI ผิด)' : esc(sc.llm)}</dd>
      </dl></section>`;
  }

  function render(id, keepPlayback) {
    if (!keepPlayback) stop();
    current = DATA.scenarios.find((s) => s.id === id) ?? DATA.scenarios[0];
    for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b.dataset.id === current.id));
    $('#scenarioNote').textContent = current.note;
    const names = buyerNames(current);
    $('#timeline').innerHTML = current.steps.map((s) => stepHTML(s, current, names)).join('');
    renderSide(current);
    try { localStorage.setItem('mara-tab', current.id); } catch {}
  }

  function stop() {
    clearInterval(timer);
    timer = null;
    $('#allBtn').hidden = true;
    $('#playBtn').hidden = false;
    for (const el of document.querySelectorAll('.step')) el.classList.remove('hidden-step');
  }

  function play() {
    const items = [...document.querySelectorAll('#timeline .step')];
    items.forEach((el) => el.classList.add('hidden-step'));
    $('#playBtn').hidden = true;
    $('#allBtn').hidden = false;
    let i = 0;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const next = () => {
      if (i >= items.length) return stop();
      const el = items[i++];
      el.classList.remove('hidden-step');
      if (!reduce) el.classList.add('reveal');
      el.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    };
    next();
    timer = setInterval(next, 900);
  }

  // แท็บ
  function drawTabs() {
    $('#tabs').innerHTML = DATA.scenarios.map((s) => `<button type="button" role="tab" data-id="${s.id}" aria-selected="${current && s.id === current.id}">${s.live ? '● ' : ''}${esc(s.live ? 'ดีลสด' : s.title)}</button>`).join('');
  }
  drawTabs();
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) render(b.dataset.id); });
  $('#playBtn').addEventListener('click', play);
  $('#allBtn').addEventListener('click', stop);
  $('#timeline').addEventListener('click', (e) => {
    const b = e.target.closest('[data-more]');
    if (b) { const li = b.closest('li'); li.classList.toggle('open'); b.textContent = li.classList.contains('open') ? 'ย่อ' : 'อ่านต่อ'; }
  });
  $('#side').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (current.live && b.dataset.f) {
      b.disabled = true;
      try {
        const r = await fetch(`api/deals/${current.id}/approvals`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ farmerId: b.dataset.f, decision: b.dataset.v === 'yes' ? 'approve' : 'reject' }) });
        const j = await r.json();
        if (!r.ok) $('#liveMsg').textContent = j.error ?? 'บันทึกไม่สำเร็จ';
      } catch { $('#liveMsg').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; }
      await refreshLive(current.id);
      return;
    }
    const a = (approvals[current.id] ??= {});
    if (b.dataset.f) a[b.dataset.f] = a[b.dataset.f] === b.dataset.v ? undefined : b.dataset.v;
    if (b.id === 'allYes') for (const f of current.farmers) if (a[f.id] !== 'no') a[f.id] = 'yes';
    if (b.id === 'resetAppr') approvals[current.id] = {};
    renderSide(current);
  });

  $('#foot').innerHTML = `<p>${esc(DATA.disclaimer)}</p><p>แหล่งราคา: ${esc(DATA.marketSource)} · วันที่ ${esc(DATA.marketDate)} · ทุกตัวเลขในหน้านี้มาจากการรันโค้ดของต้นแบบ (npm run demo:export)</p>`;

  // ---------- โหมดเจรจาสด (เฉพาะหน้าที่เสิร์ฟจาก AWS) ----------
  let poll = null;
  async function refreshLive(id) {
    try {
      const r = await fetch(`api/deals/${encodeURIComponent(id)}`, { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) { $('#liveMsg').textContent = j.error ?? 'โหลดดีลไม่สำเร็จ'; return; }
      const sc = { ...j, live: true, title: 'ดีลสด' };
      const i = DATA.scenarios.findIndex((s) => s.live);
      if (i >= 0) DATA.scenarios[i] = sc; else DATA.scenarios.unshift(sc);
      drawTabs();
      const atBottom = innerHeight + scrollY >= document.body.scrollHeight - 40;
      render(sc.id, true);
      if (atBottom && (sc.status === 'negotiating' || sc.status === 'queued')) scrollTo({ top: document.body.scrollHeight });
      const done = !['queued', 'negotiating'].includes(sc.status);
      $('#liveMsg').textContent = done ? `เสร็จแล้ว · ลิงก์ดีลนี้: ?deal=${sc.id}` : 'กำลังเจรจา…';
      if (done) { clearInterval(poll); poll = null; $('#liveStart').disabled = false; }
    } catch { $('#liveMsg').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ จะลองใหม่'; }
  }
  function follow(id) {
    clearInterval(poll);
    refreshLive(id);
    poll = setInterval(() => refreshLive(id), 2000);
  }
  if (window.MARA_LIVE) {
    $('#liveBar').hidden = false;
    $('#liveStart').addEventListener('click', async () => {
      $('#liveStart').disabled = true;
      $('#liveMsg').textContent = 'กำลังเริ่ม…';
      try {
        const r = await fetch('api/deals', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ crop: $('#liveCrop').value }) });
        const j = await r.json();
        if (!r.ok) { $('#liveMsg').textContent = j.error ?? 'เริ่มไม่สำเร็จ'; $('#liveStart').disabled = false; return; }
        history.replaceState(null, '', `?deal=${j.id}`);
        follow(j.id);
      } catch { $('#liveMsg').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; $('#liveStart').disabled = false; }
    });
    const q = new URLSearchParams(location.search).get('deal');
    if (q) follow(q);
  }

  const hashId = location.hash.slice(1);
  let saved = null;
  try { saved = localStorage.getItem('mara-tab'); } catch {}
  render(DATA.scenarios.some((s) => s.id === hashId) ? hashId : saved || DATA.scenarios[0].id);
})();
</script>
